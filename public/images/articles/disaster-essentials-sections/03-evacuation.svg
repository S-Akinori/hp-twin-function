<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f4ee"/><rect x="0" y="0" width="18" height="675" fill="#e2543d"/><text x="70" y="82" font-family="sans-serif" font-size="43" font-weight="700" fill="#20252b">避難を続けるための4点セット</text><text x="72" y="127" font-family="sans-serif" font-size="21" fill="#667079">移動中のけが・雨・断水・停電を具体的に想定</text><g transform="translate(70 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#e2543d18"/><path fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M82 46h84v30c0 38-16 58-42 58s-42-20-42-58zM99 134v18h50V46"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">携帯トイレ</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">便袋＋凝固剤</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">防臭袋も用意</text></g><g transform="translate(336 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#e98a3b18"/><path fill="none" stroke="#e98a3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M89 138V5m0 8v-42m18 37v-52m18 48v-52m18 55v-40m0 42 22 15c14 10 8 31-7 43L16 55c-25 18-51 10-51-5"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">手袋・雨具</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">破片から手を守る</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">両手が空くポンチョ</text></g><g transform="translate(602 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#d7ad3f18"/><circle fill="none" stroke="#d7ad3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" cx="124" cy="88" r="50"/><path fill="none" stroke="#d7ad3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M106 72c4-25 43-26 43 1 0 22-24 21-24 40m0 19h1"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">ホイッスル</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">閉じ込め時に合図</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">軽くて用途が明確</text></g><g transform="translate(868 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#74856a18"/><rect fill="none" stroke="#74856a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" x="79" y="50" width="90" height="88" rx="20"/><path fill="none" stroke="#74856a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M102 50v-12a22 22 0 0 1 44 0v12M99 98h50"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">現金・身分証</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">硬貨も少額用意</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">コピーは防水袋へ</text></g><rect x="70" y="560" width="1060" height="64" rx="16" fill="#20252b"/><text x="600" y="601" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">「軽い・代用しにくい・すぐ使える」を優先</text></svg>