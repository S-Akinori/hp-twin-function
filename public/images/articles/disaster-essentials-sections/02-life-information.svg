<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f4ee"/><rect x="0" y="0" width="18" height="675" fill="#e2543d"/><text x="70" y="82" font-family="sans-serif" font-size="43" font-weight="700" fill="#20252b">最優先は 水・薬・明かり・情報</text><text x="72" y="127" font-family="sans-serif" font-size="21" fill="#667079">停電・断水・通信障害が重なっても行動できる構成へ</text><g transform="translate(70 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#e2543d18"/><path fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M124 53c-30 38-42 55-42 80a42 42 0 0 0 84 0c0-25-12-42-42-80z"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">水と食料</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">移動中の脱水を防ぐ</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">加熱不要の食品を選ぶ</text></g><g transform="translate(336 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#e98a3b18"/><rect fill="none" stroke="#e98a3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" x="77" y="50" width="94" height="78" rx="14"/><path fill="none" stroke="#e98a3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M124 68v42m-21-21h42"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">薬と医療情報</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">処方薬を最優先</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">情報は紙でも携帯</text></g><g transform="translate(602 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#d7ad3f18"/><path fill="none" stroke="#d7ad3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M86 80a38 38 0 1 1 76 0c0 18-10 28-20 40v18h-36V32c-10-12-20-22-20-40zM106 146h36"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">明かり</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">両手が空くライト</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">予備電池をセット</text></g><g transform="translate(868 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#74856a18"/><rect fill="none" stroke="#74856a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" x="76" y="53" width="96" height="75" rx="10"/><path fill="none" stroke="#74856a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M96 53l50-30M98 88h18m30-6a13 13 0 1 0 0 26 13 13 0 0 0 0-26z"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">情報</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">ラジオを併用</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">連絡先を紙に控える</text></g><rect x="70" y="560" width="1060" height="64" rx="16" fill="#20252b"/><text x="600" y="601" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">スマホ1台に情報と電源を集中させない</text></svg>