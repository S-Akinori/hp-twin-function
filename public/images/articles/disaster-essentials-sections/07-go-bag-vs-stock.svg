<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f4ee"/><rect x="0" y="0" width="18" height="675" fill="#e2543d"/><text x="70" y="82" font-family="sans-serif" font-size="43" font-weight="700" fill="#20252b">持ち出し袋と自宅備蓄を分ける</text><text x="72" y="127" font-family="sans-serif" font-size="21" fill="#667079">目的が違うため、同じバッグへ全部入れない</text><g transform="translate(70 188)"><rect width="510" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="255" cy="88" r="62" fill="#e2543d18"/><rect fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" x="210" y="50" width="90" height="88" rx="20"/><path fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M233 50v-12a22 22 0 0 1 44 0v12M230 98h50"/><text x="255" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">持ち出し袋</text><text x="255" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">避難直後の最小限</text><text x="255" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">すぐ背負える重さ</text><text x="255" y="303" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">玄関・寝室に置く</text></g><g transform="translate(598 188)"><rect width="510" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="255" cy="88" r="62" fill="#e98a3b18"/><path fill="none" stroke="#e98a3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M203 84l52-45 52 45v58h-104zM240 142V17h30v37"/><text x="255" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">自宅備蓄</text><text x="255" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">最低3日分を目安</text><text x="255" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">水・食料・生活用品</text><text x="255" y="303" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">場所を分散して収納</text></g><rect x="70" y="560" width="1060" height="64" rx="16" fill="#20252b"/><text x="600" y="601" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">持って逃げる物 ≠ 自宅で生活するための物</text></svg>