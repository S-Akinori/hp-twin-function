<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f4ee"/><rect x="0" y="0" width="18" height="675" fill="#e2543d"/><text x="70" y="82" font-family="sans-serif" font-size="43" font-weight="700" fill="#20252b">災害時のスマホ電源は二重化</text><text x="72" y="127" font-family="sans-serif" font-size="21" fill="#667079">充電式を主力、乾電池式を長期停電への予備に</text><g transform="translate(70 188)"><rect width="334" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="167" cy="88" r="62" fill="#e2543d18"/><rect fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" x="119" y="58" width="92" height="60" rx="12"/><path fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M211 78h12v20H44M142 88h18m-9-9v18m28-9h18"/><text x="167" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">充電式</text><text x="167" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">普段から満充電</text><text x="167" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">大容量で主力に</text></g><g transform="translate(422 188)"><rect width="334" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="167" cy="88" r="62" fill="#e98a3b18"/><rect fill="none" stroke="#e98a3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" x="119" y="58" width="92" height="60" rx="12"/><path fill="none" stroke="#e98a3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M211 78h12v20H44M142 88h18m-9-9v18m28-9h18"/><text x="167" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">乾電池式</text><text x="167" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">電池交換で再使用</text><text x="167" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">最低限の連絡用</text></g><g transform="translate(774 188)"><rect width="334" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="167" cy="88" r="62" fill="#d7ad3f18"/><rect fill="none" stroke="#d7ad3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" x="119" y="53" width="96" height="75" rx="10"/><path fill="none" stroke="#d7ad3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M139 53l50-30M141 88h18m30-6a13 13 0 1 0 0 26 13 13 0 0 0 0-26z"/><text x="167" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">規格を統一</text><text x="167" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">ライト・ラジオも単3</text><text x="167" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">予備電池を共用</text></g><rect x="70" y="560" width="1060" height="64" rx="16" fill="#20252b"/><text x="600" y="601" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">本体・ケーブル・予備電池を防水ポーチへ</text></svg>