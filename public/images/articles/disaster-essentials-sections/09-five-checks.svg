<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f4ee"/><rect x="0" y="0" width="18" height="675" fill="#e2543d"/><text x="70" y="82" font-family="sans-serif" font-size="43" font-weight="700" fill="#20252b">半年ごとに行う5つの点検</text><text x="72" y="127" font-family="sans-serif" font-size="21" fill="#667079">「持っている」から「今すぐ使える」状態へ</text><g transform="translate(70 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#e2543d18"/><circle fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" cx="124" cy="88" r="50"/><path fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M98 88l18 19 36-42"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">期限</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">水・食品・薬</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">乾電池を交換</text></g><g transform="translate(336 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#e98a3b18"/><path fill="none" stroke="#e98a3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M86 80a38 38 0 1 1 76 0c0 18-10 28-20 40v18h-36V32c-10-12-20-22-20-40zM106 146h36"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">動作</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">ライト・ラジオ</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">充電器を試す</text></g><g transform="translate(602 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#d7ad3f18"/><path fill="none" stroke="#d7ad3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M82 46h84v30c0 38-16 58-42 58s-42-20-42-58zM99 134v18h50V46"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">使い方</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">携帯トイレを練習</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">家族で手順共有</text></g><g transform="translate(868 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#74856a18"/><rect fill="none" stroke="#74856a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" x="79" y="50" width="90" height="88" rx="20"/><path fill="none" stroke="#74856a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M102 50v-12a22 22 0 0 1 44 0v12M99 98h50"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">重さ・更新</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">避難路を歩く</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">季節・成長に対応</text></g><rect x="70" y="560" width="1060" height="64" rx="16" fill="#20252b"/><text x="600" y="601" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">防災の日・誕生日・衣替えを点検日にする</text></svg>