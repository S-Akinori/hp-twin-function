<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f4ee"/><rect x="0" y="0" width="18" height="675" fill="#e2543d"/><text x="70" y="82" font-family="sans-serif" font-size="43" font-weight="700" fill="#20252b">持ち出し袋から減らしやすい物</text><text x="72" y="127" font-family="sans-serif" font-size="21" fill="#667079">不要ではなく「自宅備蓄へ移す」と考える</text><g transform="translate(70 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#e2543d18"/><rect fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" x="79" y="50" width="90" height="88" rx="20"/><path fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M102 50v-12a22 22 0 0 1 44 0v12M99 98h50"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">重すぎる</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">大量の水・缶詰</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">大型の鍋や寝具</text></g><g transform="translate(336 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#e98a3b18"/><circle fill="none" stroke="#e98a3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" cx="124" cy="88" r="50"/><path fill="none" stroke="#e98a3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M98 88l18 19 36-42"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">役割が重なる</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">複数のライト</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">似た多機能ツール</text></g><g transform="translate(602 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#d7ad3f18"/><circle fill="none" stroke="#d7ad3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" cx="124" cy="88" r="50"/><path fill="none" stroke="#d7ad3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M106 72c4-25 43-26 43 1 0 22-24 21-24 40m0 19h1"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">使い方が不明</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">未開封の特殊用品</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">平時に使えない物</text></g><g transform="translate(868 188)"><rect width="248" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="124" cy="88" r="62" fill="#74856a18"/><path fill="none" stroke="#74856a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M72 84l52-45 52 45v58h-104zM109 142V17h30v37"/><text x="124" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">長期生活向け</text><text x="124" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">大量の衣類・食料</text><text x="124" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">自宅備蓄へ分離</text></g><rect x="70" y="560" width="1060" height="64" rx="16" fill="#20252b"/><text x="600" y="601" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">家族固有の薬・乳幼児用品は減らさない</text></svg>