<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f4ee"/><rect x="0" y="0" width="18" height="675" fill="#e2543d"/><text x="70" y="82" font-family="sans-serif" font-size="43" font-weight="700" fill="#20252b">迷ったときの3つの質問</text><text x="72" y="127" font-family="sans-serif" font-size="21" fill="#667079">入れる・外すを感覚ではなく順番で判断</text><g transform="translate(70 188)"><rect width="334" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="167" cy="88" r="62" fill="#e2543d18"/><rect fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" x="120" y="50" width="94" height="78" rx="14"/><path fill="none" stroke="#e2543d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M167 68v42m-21-21h42"/><text x="167" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">命に関わる？</text><text x="167" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">ないと健康へ影響</text><text x="167" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">YESなら残す</text></g><g transform="translate(422 188)"><rect width="334" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="167" cy="88" r="62" fill="#e98a3b18"/><circle fill="none" stroke="#e98a3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" cx="167" cy="88" r="50"/><path fill="none" stroke="#e98a3b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M149 72c4-25 43-26 43 1 0 22-24 21-24 40m0 19h1"/><text x="167" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">代用できる？</text><text x="167" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">他の物で兼用可能？</text><text x="167" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">YESなら減らせる</text></g><g transform="translate(774 188)"><rect width="334" height="332" rx="26" fill="#fff" stroke="#ded9cf"/><circle cx="167" cy="88" r="62" fill="#d7ad3f18"/><rect fill="none" stroke="#d7ad3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" x="122" y="50" width="90" height="88" rx="20"/><path fill="none" stroke="#d7ad3f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" d="M145 50v-12a22 22 0 0 1 44 0v12M142 98h50"/><text x="167" y="190" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#20252b">運べる？</text><text x="167" y="235" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">背負って歩ける？</text><text x="167" y="269" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5d646b">NOなら分散・減量</text></g><rect x="70" y="560" width="1060" height="64" rx="16" fill="#20252b"/><text x="600" y="601" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#fff">命に影響し、代用できない物からバッグへ</text></svg>