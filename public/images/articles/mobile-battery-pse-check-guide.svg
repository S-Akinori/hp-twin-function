<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">モバイルバッテリー購入前のPSE表示チェック</title>
  <desc id="desc">丸形PSEマーク、届出事業者名、定格電圧と定格容量を確認する図解</desc>
  <rect width="1200" height="720" fill="#111315"/>
  <text x="72" y="92" fill="#f7f1e5" font-family="sans-serif" font-size="42" font-weight="700">購入前に見るのは、この4項目</text>
  <text x="72" y="134" fill="#a9adb1" font-family="sans-serif" font-size="22">モバイルバッテリー本体の表示を確認</text>
  <rect x="72" y="186" width="1056" height="436" rx="28" fill="#1b1f22" stroke="#b89b5e" stroke-width="2"/>
  <rect x="120" y="226" width="390" height="352" rx="32" fill="#292e32"/>
  <circle cx="315" cy="328" r="72" fill="none" stroke="#f7f1e5" stroke-width="7"/>
  <text x="315" y="348" text-anchor="middle" fill="#f7f1e5" font-family="sans-serif" font-size="54" font-weight="700">PSE</text>
  <text x="315" y="451" text-anchor="middle" fill="#d6b66f" font-family="sans-serif" font-size="26" font-weight="700">丸形のPSEマーク</text>
  <text x="315" y="490" text-anchor="middle" fill="#a9adb1" font-family="sans-serif" font-size="19">モバイルバッテリーは</text>
  <text x="315" y="520" text-anchor="middle" fill="#a9adb1" font-family="sans-serif" font-size="19">「特定電気用品以外」</text>
  <g font-family="sans-serif">
    <circle cx="578" cy="268" r="25" fill="#b89b5e"/><text x="578" y="277" text-anchor="middle" fill="#111315" font-size="24" font-weight="700">1</text>
    <text x="624" y="277" fill="#f7f1e5" font-size="28" font-weight="700">丸形PSEマーク</text>
    <circle cx="578" cy="360" r="25" fill="#b89b5e"/><text x="578" y="369" text-anchor="middle" fill="#111315" font-size="24" font-weight="700">2</text>
    <text x="624" y="369" fill="#f7f1e5" font-size="28" font-weight="700">届出事業者名</text>
    <circle cx="578" cy="452" r="25" fill="#b89b5e"/><text x="578" y="461" text-anchor="middle" fill="#111315" font-size="24" font-weight="700">3</text>
    <text x="624" y="461" fill="#f7f1e5" font-size="28" font-weight="700">定格電圧（V）</text>
    <circle cx="578" cy="544" r="25" fill="#b89b5e"/><text x="578" y="553" text-anchor="middle" fill="#111315" font-size="24" font-weight="700">4</text>
    <text x="624" y="553" fill="#f7f1e5" font-size="28" font-weight="700">定格容量（mAh / Ah）</text>
  </g>
  <text x="72" y="676" fill="#7f8589" font-family="sans-serif" font-size="18">※小型で本体への表示が困難な場合は、例外的にパッケージ表示が認められる場合があります。</text>
</svg>
