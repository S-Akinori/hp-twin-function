<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">防災バッグから減らしやすいもの</title>
  <desc id="desc">重い、重複、使えない、備蓄向けの四分類で見直す図</desc>
  <rect width="1200" height="675" fill="#1f252b"/>
  <text x="70" y="88" font-family="sans-serif" font-size="44" font-weight="700" fill="#ffffff">迷ったら、この4種類から減らす</text>
  <text x="72" y="130" font-family="sans-serif" font-size="21" fill="#c9d0d5">「不要」ではなく、持ち出し袋より自宅備蓄に向くものがあります</text>
  <g font-family="sans-serif">
    <g transform="translate(70 180)"><rect width="500" height="170" rx="24" fill="#ffffff"/><circle cx="62" cy="58" r="30" fill="#e2543d"/><text x="62" y="68" text-anchor="middle" font-size="30" fill="white">1</text><text x="112" y="62" font-size="28" font-weight="700" fill="#20252b">重すぎるもの</text><text x="112" y="106" font-size="20" fill="#5a6168">大量の水・缶詰・大型調理器具</text><text x="112" y="138" font-size="17" fill="#8b9298">→ 自宅備蓄へ移す</text></g>
    <g transform="translate(630 180)"><rect width="500" height="170" rx="24" fill="#ffffff"/><circle cx="62" cy="58" r="30" fill="#e98a3b"/><text x="62" y="68" text-anchor="middle" font-size="30" fill="white">2</text><text x="112" y="62" font-size="28" font-weight="700" fill="#20252b">役割が重なるもの</text><text x="112" y="106" font-size="20" fill="#5a6168">同じ用途のライト・工具・食器</text><text x="112" y="138" font-size="17" fill="#8b9298">→ 軽くて慣れた1つに絞る</text></g>
    <g transform="translate(70 390)"><rect width="500" height="170" rx="24" fill="#ffffff"/><circle cx="62" cy="58" r="30" fill="#d7ad3f"/><text x="62" y="68" text-anchor="middle" font-size="30" fill="#20252b">3</text><text x="112" y="62" font-size="28" font-weight="700" fill="#20252b">使い方が不明なもの</text><text x="112" y="106" font-size="20" fill="#5a6168">未開封の特殊用品・複雑な道具</text><text x="112" y="138" font-size="17" fill="#8b9298">→ 平時に試し、使えなければ外す</text></g>
    <g transform="translate(630 390)"><rect width="500" height="170" rx="24" fill="#ffffff"/><circle cx="62" cy="58" r="30" fill="#8e9b79"/><text x="62" y="68" text-anchor="middle" font-size="30" fill="white">4</text><text x="112" y="62" font-size="28" font-weight="700" fill="#20252b">長期生活向けのもの</text><text x="112" y="106" font-size="20" fill="#5a6168">多量の食料・着替え・寝具</text><text x="112" y="138" font-size="17" fill="#8b9298">→ 持ち出し用と備蓄用を分離</text></g>
  </g>
  <text x="600" y="620" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">外す前に「家族固有の必需品ではないか」を必ず確認</text>
</svg>
