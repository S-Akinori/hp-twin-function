<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">40,000mAhモバイルバッテリーの充電回数の目安</title>
  <desc id="desc">変換ロスを考慮すると、スマートフォン約6から8回、タブレット約3から4回、ノートPC約1.5から2回が目安</desc>
  <rect width="1200" height="675" fill="#111315"/>
  <text x="72" y="88" fill="#f2c96d" font-family="Arial, sans-serif" font-size="34" font-weight="700">40,000mAhで何回充電できる？</text>
  <text x="72" y="132" fill="#c8c9cb" font-family="Arial, sans-serif" font-size="21">実際に使える容量を約70〜80%として計算した目安</text>
  <g font-family="Arial, sans-serif">
    <rect x="72" y="184" width="1056" height="112" rx="18" fill="#1c2024" stroke="#343a40"/>
    <text x="108" y="229" fill="#ffffff" font-size="25" font-weight="700">スマートフォン</text><text x="108" y="265" fill="#aeb3b8" font-size="18">内蔵電池 4,000〜5,000mAh</text>
    <text x="1064" y="252" text-anchor="end" fill="#f2c96d" font-size="38" font-weight="700">約6〜8回</text>
    <rect x="72" y="316" width="1056" height="112" rx="18" fill="#1c2024" stroke="#343a40"/>
    <text x="108" y="361" fill="#ffffff" font-size="25" font-weight="700">タブレット</text><text x="108" y="397" fill="#aeb3b8" font-size="18">内蔵電池 8,000〜10,000mAh</text>
    <text x="1064" y="384" text-anchor="end" fill="#f2c96d" font-size="38" font-weight="700">約3〜4回</text>
    <rect x="72" y="448" width="1056" height="112" rx="18" fill="#1c2024" stroke="#343a40"/>
    <text x="108" y="493" fill="#ffffff" font-size="25" font-weight="700">USB-CノートPC</text><text x="108" y="529" fill="#aeb3b8" font-size="18">内蔵電池 50〜70Wh</text>
    <text x="1064" y="516" text-anchor="end" fill="#f2c96d" font-size="38" font-weight="700">約1.5〜2回</text>
    <text x="72" y="622" fill="#8e949a" font-size="17">※機種・ケーブル・出力・温度・劣化状態で前後します。40,000mAh＝約148Wh（公称電圧3.7V換算）。</text>
  </g>
</svg>
