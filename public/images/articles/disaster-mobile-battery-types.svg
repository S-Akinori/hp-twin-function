<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">防災用モバイルバッテリー4タイプ比較</title><desc id="desc">小型、大容量、乾電池式、ソーラー式の用途と注意点を比較する図</desc>
  <rect width="1200" height="720" rx="36" fill="#f7f4ed"/><text x="70" y="82" font-family="sans-serif" font-size="42" font-weight="700" fill="#1f2933">防災用は「1台で全部」より、役割を分ける</text>
  <text x="70" y="125" font-family="sans-serif" font-size="22" fill="#52606d">日常携帯＋自宅備蓄＋電池切れ対策を組み合わせると安心</text>
  <g font-family="sans-serif">
    <g transform="translate(70 180)"><rect width="500" height="205" rx="24" fill="#fff" stroke="#d8d2c4" stroke-width="2"/><circle cx="72" cy="70" r="38" fill="#ffe08a"/><text x="72" y="80" text-anchor="middle" font-size="30">軽</text><text x="130" y="60" font-size="28" font-weight="700" fill="#1f2933">小型 5,000mAh前後</text><text x="130" y="98" font-size="21" fill="#334e68">避難時に常に携帯しやすい</text><text x="35" y="150" font-size="19" fill="#16794b">○ 軽量・日常兼用</text><text x="270" y="150" font-size="19" fill="#a14b2b">△ 充電回数は少なめ</text><text x="35" y="181" font-size="18" fill="#52606d">向く人：荷物を軽くしたい人</text></g>
    <g transform="translate(630 180)"><rect width="500" height="205" rx="24" fill="#fff" stroke="#d8d2c4" stroke-width="2"/><circle cx="72" cy="70" r="38" fill="#9bd3c7"/><text x="72" y="80" text-anchor="middle" font-size="28">備</text><text x="130" y="60" font-size="28" font-weight="700" fill="#1f2933">大容量 10,000〜20,000mAh</text><text x="130" y="98" font-size="21" fill="#334e68">停電時の自宅備蓄の主力</text><text x="35" y="150" font-size="19" fill="#16794b">○ 複数回・複数台に対応</text><text x="285" y="150" font-size="19" fill="#a14b2b">△ 重く充電に時間</text><text x="35" y="181" font-size="18" fill="#52606d">向く人：家族分も確保したい人</text></g>
    <g transform="translate(70 425)"><rect width="500" height="205" rx="24" fill="#fff" stroke="#d8d2c4" stroke-width="2"/><circle cx="72" cy="70" r="38" fill="#b9c9e8"/><text x="72" y="80" text-anchor="middle" font-size="28">乾</text><text x="130" y="60" font-size="28" font-weight="700" fill="#1f2933">乾電池式</text><text x="130" y="98" font-size="21" fill="#334e68">停電が長引いたときの保険</text><text x="35" y="150" font-size="19" fill="#16794b">○ 電池を交換して使える</text><text x="285" y="150" font-size="19" fill="#a14b2b">△ 出力・回数は控えめ</text><text x="35" y="181" font-size="18" fill="#52606d">向く人：長期停電にも備えたい人</text></g>
    <g transform="translate(630 425)"><rect width="500" height="205" rx="24" fill="#fff" stroke="#d8d2c4" stroke-width="2"/><circle cx="72" cy="70" r="38" fill="#f4b7a5"/><text x="72" y="80" text-anchor="middle" font-size="28">太</text><text x="130" y="60" font-size="28" font-weight="700" fill="#1f2933">ソーラー式／パネル</text><text x="130" y="98" font-size="21" fill="#334e68">晴天時に電源を補える</text><text x="35" y="150" font-size="19" fill="#16794b">○ コンセント不要</text><text x="270" y="150" font-size="19" fill="#a14b2b">△ 天候・設置条件に左右</text><text x="35" y="181" font-size="18" fill="#52606d">向く人：屋外で充電環境を作れる人</text></g>
  </g>
</svg>
